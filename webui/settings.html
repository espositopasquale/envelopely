<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envelopely - Account and SMTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&amp;family=Raleway:wght@300;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#17365d;--teal:#277d7e;--ink:#111;--muted:#454545;--line:#7f8791;--panel:#d9dce1;--paper:#f7f7f2;--soft:#eceff2}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background-color:#737c87;background-image:radial-gradient(ellipse at 50% 18%,rgba(220,228,236,.28) 0,rgba(105,116,129,.18) 42%,rgba(45,54,66,.34) 100%),repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 6px);background-attachment:fixed;font:14px/1.5 "Nunito Sans",Arial,sans-serif}
.window{width:min(1100px,calc(100% - 24px));margin:18px auto;border:2px outset #eee;background:#c9cdd2;box-shadow:4px 5px 0 rgba(0,0,0,.28)}
header{display:flex;align-items:center;gap:14px;padding:10px 14px;color:#fff;background:var(--navy)}
header img{width:64px;height:64px;object-fit:cover}
h1{margin:0;font:300 34px/1 "Raleway",sans-serif}
.toolbar{padding:5px 8px;border-bottom:1px solid var(--line);background:#e8e8e8}
.toolbar a{padding:3px 9px;color:#111;text-decoration:none;font:600 12px "Raleway",sans-serif}
main{padding:7px}
form{padding:10px;border:2px groove #f4f5f6;background:var(--panel)}
h2{margin:-2px 0 8px;padding:3px 5px;color:#111;border-bottom:1px solid #858b93;background:#c3c8ce;font:700 13px/1.25 "Raleway",sans-serif;text-transform:uppercase;letter-spacing:.04em}
.hint{margin:0 0 14px;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
label{display:block;margin:7px 0 2px;color:#111;font-weight:700}
input,select,button{font:inherit}
input,select{width:100%;min-width:0;padding:5px 6px;border:2px inset #f4f4f4;background:#fff;color:var(--ink);font-family:"Nunito Sans",Arial,sans-serif}
input:focus,select:focus,button:focus-visible{outline:1px dotted #111;outline-offset:1px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:7px 4px;padding:6px;border:1px solid #858b93;background:#bfc4ca}
button{min-width:105px;padding:5px 11px;border:2px outset #f4f4f4;background:var(--panel);color:#111;font:700 12px "Raleway",sans-serif;cursor:pointer}
button:hover{background:#e8eaed}
button:active{border-style:inset}
button:disabled{opacity:.6;cursor:wait}
#state{min-width:0;padding:1px 7px;border:1px inset #eee;background:#e8e8e8;color:#111;font-size:11px}
.status{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding:3px 7px;border:1px inset #eee;background:var(--panel);color:#333;font-size:11px}
@media(max-width:760px){.window{width:100%;margin:0;border-width:0}.grid{grid-template-columns:minmax(0,1fr)}main{padding:7px}form{padding:10px}header{gap:10px}header img{width:52px;height:52px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="window">
<header><img src="envelopely-logo-dark-icon.png" alt=""><div><h1>Account and SMTP</h1><div>Local mail delivery settings</div></div></header>
<div class="toolbar"><a href="/">&larr; Return to Envelopely</a></div>
<main>
<form id="settingsForm">
<h2>Sender account</h2>
<p class="hint">Settings are saved locally. The saved password is never shown here; leave the password field empty to preserve it.</p>
<div class="grid">
<div><label for="smtpHost">SMTP host</label><input id="smtpHost" name="smtpHost" type="text" autocomplete="off" placeholder="smtp.example.com"></div>
<div><label for="smtpPort">SMTP port</label><input id="smtpPort" name="smtpPort" type="number" min="1" max="65535" required></div>
<div><label for="smtpTls">TLS mode</label><select id="smtpTls" name="smtpTls"><option value="">STARTTLS / automatic</option><option value="implicit">Implicit TLS</option></select></div>
<div><label for="smtpUser">SMTP username</label><input id="smtpUser" name="smtpUser" type="text" autocomplete="username"></div>
<div><label for="smtpPass">SMTP password or token</label><input id="smtpPass" name="smtpPass" type="password" autocomplete="new-password"></div>
<div><label for="mailFrom">From address</label><input id="mailFrom" name="from" type="text" autocomplete="email"></div>
<div><label for="fromName">Sender name</label><input id="fromName" name="fromName" type="text" autocomplete="name"></div>
<div><label for="replyTo">Reply-to address</label><input id="replyTo" name="replyTo" type="text" autocomplete="email"></div>
</div>
<div class="actions"><button id="saveSettings" type="submit" disabled>Save account settings</button><span id="state" role="status" aria-live="polite">Loading settings...</span></div>
</form>
</main>
<div class="status"><span>LOCAL MODE</span><span>Envelopely</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const form=$('settingsForm');
async function loadSettings(){
    const response=await fetch('/api/settings',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load settings.');
    const settings=await response.json();
    $('smtpHost').value=settings.smtpHost||'';
    $('smtpPort').value=settings.smtpPort||'587';
    $('smtpTls').value=settings.smtpTLS||'';
    $('smtpUser').value=settings.smtpUser||'';
    $('smtpPass').value='';
    $('smtpPass').placeholder=settings.passwordSet?'Password configured; leave empty to preserve':'Enter an app password or SMTP token';
    $('mailFrom').value=settings.from||'';
    $('fromName').value=settings.fromName||'';
    $('replyTo').value=settings.replyTo||'';
    $('saveSettings').disabled=false;
    $('state').textContent='Settings loaded.';
}
form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(!confirm('Save account settings locally?'))return;
    const button=$('saveSettings');
    button.disabled=true;
    $('state').textContent='Saving...';
    const body={smtpHost:$('smtpHost').value,smtpPort:$('smtpPort').value,smtpTLS:$('smtpTls').value,smtpUser:$('smtpUser').value,smtpPass:$('smtpPass').value,from:$('mailFrom').value,fromName:$('fromName').value,replyTo:$('replyTo').value};
    try{
        const response=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(!response.ok){$('state').textContent=await response.text();return;}
        $('smtpPass').value='';
        $('smtpPass').placeholder='Password saved; leave empty to preserve';
        $('state').textContent='Saved locally.';
    }catch(error){$('state').textContent='Could not save settings. Check the local server connection.';}
    finally{button.disabled=false;}
});
loadSettings().catch(error=>{$('state').textContent=error.message;});
</script>
</body>
</html>
